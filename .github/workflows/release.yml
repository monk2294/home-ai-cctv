name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: verify-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify release
        run: |
          npm test
          npm run typecheck
          npm run build
          npm run generate:api
          git diff --exit-code -- server/src/generated/api-v1.d.ts web/src/generated/api-v1.d.ts
      - name: Check tag and package versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          export VERSION
          node <<'NODE'
          const { readFileSync } = require('node:fs');
          for (const file of ['package.json', 'server/package.json', 'web/package.json', 'mcp/package.json']) {
            const actual = JSON.parse(readFileSync(file, 'utf8')).version;
            if (actual !== process.env.VERSION) {
              throw new Error(`${file}: version ${actual} does not match tag v${process.env.VERSION}`);
            }
          }
          NODE
      - name: Login to GHCR
        run: >-
          echo "${{ github.token }}" |
          docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and push versioned images
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for component in server web mcp; do
            image="ghcr.io/${OWNER}/home-ai-cctv/${component}:${VERSION}"
            docker build \
              --file "${component}/Dockerfile" \
              --tag "$image" \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.version=${VERSION}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              .
            docker push "$image"
          done
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
